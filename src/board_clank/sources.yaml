    registered_state: REGISTERED
    promotion_state: EXPERIMENTAL
    expected_identity_surface: family+board+revision
    expected_variant_surface: ram+emmc+bundle
    notes: Official Orange Pi English catalogue (HTTP-only first party; www.orangepi.org canonical; orangepi.cn mirror, wiki and commerce stores not ingested). Foundation 2A experimental PRODUCT adapter; disabled by default; live fetch is manual --experimental-live only; not promoted.

