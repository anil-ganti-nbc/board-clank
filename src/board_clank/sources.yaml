# Board Clank source roster — Foundation 0
# Phase-1 vendors are REGISTERED / EXPERIMENTAL only.
# No source is promoted. No source is enabled for live collection.
# Discovery appearance is not novelty. Store appearance is not announcement.

meta:
  foundation: 0
  promotion_freeze: true
  live_collection: false
  jetson_scope: out-of-scope-pending-decision

sources:
  - source_key: raspberry-pi-product
    vendor: raspberry-pi
    plane: PRODUCT
    authority: FIRST_PARTY_CANONICAL
    base_urls:
      - https://www.raspberrypi.com/products/
    enabled: false
    registered_state: REGISTERED
    promotion_state: EXPERIMENTAL
    expected_identity_surface: family+board+revision
    expected_variant_surface: ram+wireless
    notes: Official product catalogue. Foundation 1 experimental PRODUCT adapter exists; disabled by default; live fetch is manual --experimental-live only; not promoted.

  - source_key: orange-pi-product
    vendor: orange-pi
