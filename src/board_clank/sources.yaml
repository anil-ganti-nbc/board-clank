    vendor: raspberry-pi
    plane: PRODUCT
    authority: FIRST_PARTY_CANONICAL
    base_urls:
      - https://www.raspberrypi.com/products/
    enabled: false
    registered_state: REGISTERED
    promotion_state: EXPERIMENTAL
    expected_identity_surface: family+board+revision
    expected_variant_surface: ram+wireless
    notes: Official product catalogue. Foundation 1 experimental PRODUCT adapter exists; disabled by default; live fetch is manual --experimental-live only; not promoted.

