# Board Clank source roster — Foundation 0
# Phase-1 vendors are REGISTERED / EXPERIMENTAL only.
# No source is promoted. No source is enabled for live collection.
# Discovery appearance is not novelty. Store appearance is not announcement.

meta:
  foundation: 0
  promotion_freeze: true
  live_collection: false
  jetson_scope: out-of-scope-pending-decision

