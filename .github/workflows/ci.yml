name: Seven-source bounded locked CI
on:
  pull_request:
  push:
    branches: [hermes/board-seven-readiness-20261030]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: board-seven-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    name: ci / seven-causal-38 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      # Hosted runs are attributed by GitHub's immutable run/job/SHA fields,
      # not by an ended local engineer's ClankOps Session.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies in isolated environment
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'board-locked-venv'
          subprocess.run([sys.executable,'-m','venv',str(root)],check=True)
          py=str(root/('Scripts/python.exe' if os.name=='nt' else 'bin/python'))
          subprocess.run([py,'-m','pip','install','-r','requirements.lock','-r','requirements-dev.lock'],check=True)
          subprocess.run([py,'-m','pip','install','--no-deps','-e','.'],check=True)
          subprocess.run([py,'-m','pip','check'],check=True)
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write('BOARD_CI_PYTHON='+py+'\n')
      - name: Exact portable selection, network denial and mothball fence
        shell: python
        env:
          BOARD_CI_GUARD: '1'
          BOARD_REVIEW_FENCE_LOG: ${{ runner.temp }}/mothball-fence.log
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
        run: |
          import os, pathlib, subprocess, sys, json
          env=dict(os.environ)
          assert env['GITHUB_ACTIONS']=='true'
          fields=('GITHUB_REPOSITORY','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','GITHUB_SHA','GITHUB_JOB','RUNNER_OS')
          pathlib.Path('hosted-provenance.json').write_text(json.dumps({k:env[k] for k in fields},indent=2))
          env['BOARD_GUARD_PROOF']=str(pathlib.Path('guard-proof.json').resolve())
          env['PYTHONPATH']=str(pathlib.Path('.github/qualification').resolve())
          wrong=dict(env);wrong['BOARD_CI_GUARD']='0'
          py=os.environ['BOARD_CI_PYTHON']
          denied=subprocess.run([py,'-B','-c',"import os; assert os.environ.get('BOARD_SEAM_GUARD_ENTERED')=='1'"],env=wrong,capture_output=True)
          assert denied.returncode!=0, 'wrong guard unexpectedly entered'
          import json
          selection=json.loads(pathlib.Path('.github/qualification/seven_selection.json').read_text())
          prior=json.loads(pathlib.Path('.github/qualification/selection.json').read_text())
          assert len(selection['selected'])==len(set(selection['selected']))==38
          assert set(selection['prior_executed_nodes']) <= set(prior['allowed'])
          assert not set(selection['selected']) & set(prior['NOT_RUN'])
          subprocess.run([py,'-B','-m','pytest','-p','seven_guard','-p','no:cacheprovider','--tb=short','--junitxml=permitted.xml',*selection['selected']],env=env,check=True)
          assert not pathlib.Path(env['BOARD_REVIEW_FENCE_LOG']).exists(), 'mothball fence attempted'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: permitted-${{ matrix.os }}
          path: |
            permitted.xml
            guard-proof.json
            hosted-provenance.json
  container:
    name: ci / container-nonroot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build locked installed artifact
        run: docker build --build-arg GIT_REVISION=${GITHUB_SHA} -t board-clank:ci .
      - name: Source-disabled installed health
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --user 10001 board-clank:ci health
          docker inspect --format='{{index .Config.Labels "org.opencontainers.image.revision"}}' board-clank:ci
