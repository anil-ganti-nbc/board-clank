name: Foundation 0 CI

on:
  pull_request:
  push:
    branches: [main, foundation-0, foundation-1-rpi-product, foundation-2-orange-pi-product, foundation-2b-diagnostic-idempotency, foundation-3-radxa-product, foundation-4-banana-pi-product, foundation-5-odroid-product, foundation-6-pine64-product, production-readiness-1, production-readiness-1b-odroid-coverage]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation0-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  NO_COLOR: "1"

jobs:
  tests:
    name: ci / hermetic-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Prove lock pins
        run: |
          python - <<'PY'
          import importlib.metadata as m
          expected = {
              "PyYAML": "6.0.1",
              "pydantic": "2.13.4",
              "pydantic-core": "2.46.4",
              "pytest": "8.4.2",
          }
          for name, ver in expected.items():
              got = m.version(name)
              print(f"{name}={got}")
              if got != ver:
                  raise SystemExit(f"lock mismatch: {name} expected {ver} got {got}")
          PY
      - name: Compile
        run: python -m compileall -q src
      - name: Tests with black-hole proxy
        env:
          NO_PROXY: "127.0.0.1,localhost,::1"
          HTTP_PROXY: "http://127.0.0.1:9"
          HTTPS_PROXY: "http://127.0.0.1:9"
          ALL_PROXY: "http://127.0.0.1:9"
        run: pytest -q
      - name: Foundation roster freeze
        run: board-clank sources --assert-foundation
      - name: CLI smoke
        run: |
          board-clank version
          board-clank identity
          board-clank health
      - name: Production readiness gates
        run: |
          board-clank manifest
          board-clank manifest-declared
          rm -f /tmp/pr-ci.db /tmp/pr-ci-restored.db
          board-clank --db /tmp/pr-ci.db collect --source orange-pi-product --run-id pr-ci
          board-clank --db /tmp/pr-ci.db backup --out /tmp/pr-ci-backup
          BACKUP_DB=$(ls /tmp/pr-ci-backup/*.board-clank-backup.db)
          BACKUP_META=$(ls /tmp/pr-ci-backup/*.board-clank-backup.meta.json)
          board-clank restore --backup-file "$BACKUP_DB" --metadata "$BACKUP_META" --target /tmp/pr-ci-restored.db --activate
          board-clank --db /tmp/pr-ci-restored.db observe > /dev/null
          echo "production-readiness gates passed: manifest + backup + restore + observe"

  container:
    name: ci / container-nonroot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build --build-arg GIT_REVISION=${GITHUB_SHA} -t board-clank:ci .
      - name: Health as non-root
        run: |
          docker run --rm --user 10001 board-clank:ci health
          docker inspect --format='{{index .Config.Labels "org.opencontainers.image.revision"}}' board-clank:ci
