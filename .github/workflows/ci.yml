name: Eight-source locked CI
on:
  pull_request:
  push:
    branches: [hermes/board-eight-readiness-20261028]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: board-eight-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    name: ci / permitted-731 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CLANKOPS_ACTOR: hermes-board-golive-engineer
      CLANKOPS_CLANK_ID: 01a0ca71-1b64-7423-af57-385119dfbe81
      CLANKOPS_MISSION_ID: 01a166a9-7fa0-7752-b870-b89c3f1f2481
      CLANKOPS_SESSION_ID: 01a1878e-4a99-705c-8813-093e4d18204f
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements.lock -r requirements-dev.lock
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Exact portable selection, network denial and mothball fence
        shell: python
        env:
          BOARD_CI_GUARD: '1'
          BOARD_REVIEW_FENCE_LOG: ${{ runner.temp }}/mothball-fence.log
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
        run: |
          import os, pathlib, subprocess, sys
          env=dict(os.environ)
          env['PYTHONPATH']=str(pathlib.Path('.github/qualification').resolve())
          wrong=dict(env);wrong['BOARD_CI_GUARD']='0'
          denied=subprocess.run([sys.executable,'-B','-c',"import os; assert os.environ.get('BOARD_SEAM_GUARD_ENTERED')=='1'"],env=wrong,capture_output=True)
          assert denied.returncode!=0, 'wrong guard unexpectedly entered'
          subprocess.run([sys.executable,'-B','-m','pytest','-p','permitted_plugin','-p','no:cacheprovider','--tb=short','--junitxml=permitted.xml'],env=env,check=True)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: permitted-${{ matrix.os }}
          path: permitted.xml
  container:
    name: ci / container-nonroot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build locked installed artifact
        run: docker build --build-arg GIT_REVISION=${GITHUB_SHA} -t board-clank:ci .
      - name: Source-disabled installed health
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --user 10001 board-clank:ci health
          docker inspect --format='{{index .Config.Labels "org.opencontainers.image.revision"}}' board-clank:ci
